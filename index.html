<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>অর্ডার হিসাব</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f5f7;color:#222}.top{background:#1260d8;color:#fff;padding:18px;text-align:center;font-size:25px;font-weight:700}.wrap{max-width:650px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001;margin-bottom:14px}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}textarea{min-height:85px}button{width:100%;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:700;margin-top:14px;background:#159447;color:#fff}button:disabled{opacity:.6}.msg{padding:12px;border-radius:9px;margin-top:12px;display:none}.ok{background:#e8f7ee;color:#126b38}.err{background:#ffe8e8;color:#a00}.hint{font-size:13px;color:#666;margin-top:5px}.spinner{display:none}
  </style>
</head>
<body>
<div class="top">📊 অর্ডার হিসাব</div>
<div class="wrap">
  <div class="card">
    <form id="orderForm" autocomplete="off">
      <label>অর্ডার আইডি / Invoice</label>
      <input id="invoice" required placeholder="যেমন: ORD-1001">

      <label>Customer নাম</label>
      <input id="customer_name" required placeholder="Customer নাম">

      <label>মোবাইল নম্বর</label>
      <input id="customer_phone" required inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX">

      <label>সম্পূর্ণ ঠিকানা</label>
      <textarea id="delivery_address" required placeholder="বাড়ি/রোড/এলাকা"></textarea>

      <label>জেলা</label>
      <select id="district" required>
        <option value="">জেলা নির্বাচন করুন</option>
      </select>
      <div class="hint" id="districtHint">Steadfast-এর police station list থেকে জেলা নেওয়া হবে।</div>

      <label>থানা / Upazila</label>
      <select id="thana" required disabled>
        <option value="">আগে জেলা নির্বাচন করুন</option>
      </select>

      <label>COD Amount</label>
      <input id="cod_amount" required type="number" min="0" step="0.01" value="0">

      <label>Product নাম</label>
      <input id="item_description" placeholder="পণ্যের নাম">

      <label>Quantity</label>
      <input id="total_lot" type="number" min="1" value="1">

      <label>Note</label>
      <textarea id="note" placeholder="অতিরিক্ত তথ্য"></textarea>

      <button id="submitBtn" type="submit"><span id="btnText">🚚 Steadfast Entry</span><span id="spinner" class="spinner"> অপেক্ষা করুন...</span></button>
      <div id="message" class="msg"></div>
    </form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
